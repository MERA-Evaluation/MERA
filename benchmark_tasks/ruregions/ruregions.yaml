task: ruregions
dataset_path: MERA-evaluation/RuRegions
output_type: generate_until
fewshot_split: shots
test_split: test
doc_to_text: !function utils.doc_to_text
doc_to_target: "outputs"
process_results: !function utils.process_results

filter_list:
  - name: "scoring"
    filter:
      - function: remove_whitespace_and_nones
      - function: take_first

metric_list:
  - metric: exact_match
    aggregation: mean
    higher_is_better: true
  - metric: group_exact_match
    aggregation: !function utils.aggregate_group_score
    higher_is_better: true
  - metric: judge_score
    aggregation: mean
    higher_is_better: true
  - metric: group_judge_score
    aggregation: !function utils.aggregate_group_score
    higher_is_better: true
num_fewshot: 0
metadata:
  version: 1.0