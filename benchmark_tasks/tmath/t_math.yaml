dataset_path: MERA-evaluation/T-math
task: t_math

test_split: test
fewshot_split: shots

output_type: generate_until

doc_to_text: !function utils.doc_to_text
doc_to_target: "{{ outputs.strip() }}"

# MERA-style few-shot construction: only the first shot carries the full
# instruction. Dormant under the default num_fewshot: null (zero-shot),
# activates when running with --num_fewshot N.
fewshot_config:
  sampler: !function ../custom_samplers.FewshotSampler  # processes no instruction doc and changes doc_to_text
  doc_to_text_without_instruction: "{{'Задача:\n\n{question}\n'.format(**inputs)}}"
  query: "{{instruction.format(**inputs)}}"

# Reasoning task: median reasoning length for strong models is ~16K tokens.
# The default lm-eval limit (input+256) is far too small -- raise it explicitly.
# do_sample: false -> greedy decoding; exact_match then equals pass@1.
generation_kwargs:
  do_sample: false
  max_new_tokens: 16384
  until:
    - "<|eot_id|>"
    - "<|im_end|>"
    - "</s>"

# Answer extraction is NOT done via filters: parse() from math_verify
# extracts \boxed{...} (or the last plain expression) from the raw
# generation inside process_results. take_first only unpacks [[gen]] -> [gen].
filter_list:
  - name: "scoring"
    filter:
      - function: "take_first"

# The metric is computed in process_results via math_verify: symbolic
# comparison of the prediction against the gold (1/2 == 0.5). Equivalent
# to pass@1 under greedy decoding.
process_results: !function utils.process_results
metric_list:
  - metric: exact_match
    aggregation: mean
    higher_is_better: true

num_fewshot: null
metadata:
  version: 1.0
