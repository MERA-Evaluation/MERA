dataset_path: MERA-evaluation/enantiosemy
task: enantiosemy

test_split: test
fewshot_split: test

output_type: multiple_choice

doc_to_text: !function utils.doc_to_text
doc_to_target: outputs

doc_to_choice:
  - "А"
  - "Б"
  - "В"
  - "Г"

fewshot_config:
  sampler: default

filter_list:
  - name: "scoring"
    filter:
      - function: "take_first"

process_results: !function utils.process_results

metric_list:
  - metric: em
    aggregation: mean
    higher_is_better: true

num_fewshot: null

metadata:
  version: 1.0