tag:
  - mera
  - mera_all
dataset_path: MERA-evaluation/Luzitania
dataset_name: null
task: luzitania
training_split: shots
validation_split: test
test_split: test
fewshot_split: shots
output_type: generate_until
doc_to_text: "{{instruction.format(**inputs)}}"
doc_to_target: "{{outputs}}"
fewshot_delimiter: "\n\nНапример: "
target_delimiter: "\nОтвет: "
num_fewshot: 0
fewshot_config:
  sampler: !function ../custom_samplers.FewshotSampler
  doc_to_text_without_instruction: "{{inputs.question}}"
  query: "{{instruction.format(**inputs)}}"
filter_list:
  - name: "strict-match"
    filter:
      - function: regex
        regex_pattern: "(?:(?:ответ|Ответ|ОТВЕТ)(?:ом)?[\\s:—-]+(?:является|равен|будет|это|составляет)?[\\s]*(?:число[м]?)?[\\s:—-]*|^)(-?\\d+(?:\\.\\d+)?)"
        group_select: -1
        fallback: "[INVALID]"
      - function: take_first
  - name: "flexible-extract"
    filter:
      - function: regex
        regex_pattern: "(-?\\d+(?:\\.\\d+)?)"
        group_select: -1
        fallback: "[NO_NUMBER]"
      - function: take_first
metric_list:
  - metric: exact_match
    aggregation: mean
    higher_is_better: true
    ignore_case: false
    ignore_punctuation: false
    regexes_to_ignore:
      - "\\$"
      - "\\boxed"
      - "\\["
      - "\\]"
generation_kwargs:
  do_sample: false
  temperature: 0.0
  max_new_tokens: 65536
repeats: 1
metadata:
  version: 1.0
  license: "CC BY-NC-SA 4.0"
  keywords:
    - math
    - mathematics
    - reasoning
