include: ../custom_generate_task.yaml
dataset_path: dondosss/mmred_mera
tag:
  - mera
  - mera_all
  - mmred
num_fewshot: 0
process_results: !function utils.process_results
generation_kwargs:
  do_sample: false
  until:
    - "\n\n"
    - "\nStep"
    - "\nШаг"
filter_list:
  - name: "scoring"
    filter:
      - function: !function utils.extract_answer_filter
      - function: "take_first"
metric_list:
  - metric: exact_match
    aggregation: mean
    higher_is_better: true
    ignore_case: true
    ignore_punctuation: true
metadata:
  version: 1.0
