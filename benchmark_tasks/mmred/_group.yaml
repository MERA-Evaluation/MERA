group: mmred
group_alias: MMReD Dense Context Reasoning
task:
  - group: mmred_dc_sa_c
    group_alias: DC-SA-C (spend_alone)
    task:
      - mmred_dc_sa_c_32
      - mmred_dc_sa_c_64
      - mmred_dc_sa_c_128
    aggregate_metric_list:
      - metric: em.dc_aggregate
        aggregation: !function utils.group_length_weighted_aggregate
        filter_list: scoring
  - group: mmred_dc_sr_i
    group_alias: DC-SR-I (steps_in_room)
    task:
      - mmred_dc_sr_i_32
      - mmred_dc_sr_i_64
      - mmred_dc_sr_i_128
    aggregate_metric_list:
      - metric: em.dc_aggregate
        aggregation: !function utils.group_length_weighted_aggregate
        filter_list: scoring
  - group: mmred_dc_cc_i
    group_alias: DC-CC-I (crowd_count)
    task:
      - mmred_dc_cc_i_32
      - mmred_dc_cc_i_64
      - mmred_dc_cc_i_128
    aggregate_metric_list:
      - metric: em.dc_aggregate
        aggregation: !function utils.group_length_weighted_aggregate
        filter_list: scoring
  - group: mmred_dc_ws_r
    group_alias: DC-WS-R (where_spend)
    task:
      - mmred_dc_ws_r_32
      - mmred_dc_ws_r_64
      - mmred_dc_ws_r_128
    aggregate_metric_list:
      - metric: em.dc_aggregate
        aggregation: !function utils.group_length_weighted_aggregate
        filter_list: scoring
  - group: mmred_dc_whs_c
    group_alias: DC-WHS-C (who_spend)
    task:
      - mmred_dc_whs_c_32
      - mmred_dc_whs_c_64
      - mmred_dc_whs_c_128
    aggregate_metric_list:
      - metric: em.dc_aggregate
        aggregation: !function utils.group_length_weighted_aggregate
        filter_list: scoring
aggregate_metric_list:
  - metric: em.dc_aggregate
    aggregation: !function utils.group_harmonic_mean_aggregate
    filter_list: scoring
