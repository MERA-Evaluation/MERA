group: mmred
group_alias: MMReD Dense Context Reasoning
task:
  - mmred_dc_sa_c_32
  - mmred_dc_sa_c_64
  - mmred_dc_sa_c_128
  - mmred_dc_sr_i_32
  - mmred_dc_sr_i_64
  - mmred_dc_sr_i_128
  - mmred_dc_cc_i_32
  - mmred_dc_cc_i_64
  - mmred_dc_cc_i_128
  - mmred_dc_ws_r_32
  - mmred_dc_ws_r_64
  - mmred_dc_ws_r_128
  - mmred_dc_whs_c_32
  - mmred_dc_whs_c_64
  - mmred_dc_whs_c_128
# lm-eval aggregates ONLY a metric the leaf tasks actually emit, always via a
# (size-)weighted mean; a custom `aggregation: !function` is ignored at group level.
# Leaf tasks emit `exact_match` (see mmred_base.yaml), so aggregate that.
aggregate_metric_list:
  - metric: exact_match
    aggregation: mean
    weight_by_size: true
