dataset_path: MERA-evaluation/SAGE
task: sage

test_split: test

output_type: generate_until

doc_to_text: "{{instruction.format(**inputs).strip()}}"
doc_to_target: "outputs"

filter_list:
  - name: "scoring"
    filter:
        - function: remove_whitespace_and_nones
        - function: "take_first"


process_results: !function utils.process_results
metric_list:
  - metric: errant
    aggregation: mean
    higher_is_better: true
  - metric: CASE_F1
    aggregation: mean
    higher_is_better: true
  - metric: YO_F1
    aggregation: mean
    higher_is_better: true
  - metric: SPELL_F1
    aggregation: mean
    higher_is_better: true
  - metric: PUNCT_F1
    aggregation: mean
    higher_is_better: true

num_fewshot: null
metadata:
  version: 1.0
