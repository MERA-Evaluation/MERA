tag:
  - mera
  - mera_all
dataset_path: MERA-evaluation/GorillaHard
task: gorillahard

test_split: test
# fewshot_split обязан совпадать с test_split, хотя история диалогов лежит в
# сплите shots: только при совпадении сплитов lm-eval передаёт сэмплеру текущий
# документ (eval_doc), без которого неизвестно, из какого диалога тянуть
# историю. Пул, который харнесс при этом отдаёт сэмплеру, не используется —
# DialogSampler читает shots сам. Подробности в dialog_sampler.py.
fewshot_split: test

output_type: generate_until

doc_to_text: !function utils.doc_to_text
doc_to_target: "{{outputs}}"

fewshot_config:
  sampler: !function dialog_sampler.DialogSampler
  doc_to_text: "{{inputs.question}}"

target_delimiter: "\n\n"

# generation_kwargs:
#   do_sample: false
#   temperature: 0.0
#   max_gen_toks: 32768
#   until:
#     - "<|eot_id|>"
#     - "<|im_end|>"
#     - "</s>"

filter_list:
  - name: "scoring"
    filter:
      - function: remove_whitespace_and_nones
      - function: "take_first"

process_results: !function utils.process_results

metric_list:
  - metric: sample_pass_rate
    aggregation: mean
    higher_is_better: true
  - metric: balance_score
    aggregation: !function utils.balance_aggregation
    higher_is_better: true
  - metric: dialog_pass_rate
    aggregation: !function utils.dialog_aggregation
    higher_is_better: true
  - metric: constraint_pass_rate
    aggregation: mean
    higher_is_better: true
  - metric: format_pass_rate
    aggregation: mean
    higher_is_better: true
  - metric: tool_match_rate
    aggregation: mean
    higher_is_better: true
  - metric: args_match_rate
    aggregation: mean
    higher_is_better: true
  - metric: abstention_recall
    aggregation: mean
    higher_is_better: true
  - metric: false_abstention_rate
    aggregation: mean
    higher_is_better: false
  - metric: clarify_recall
    aggregation: mean
    higher_is_better: true
  - metric: false_clarify_rate
    aggregation: mean
    higher_is_better: false
  - metric: tool_in_catalog_rate
    aggregation: mean
    higher_is_better: true
  - metric: cost_optimal_rate
    aggregation: mean
    higher_is_better: true
  - metric: injection_resistance_rate
    aggregation: mean
    higher_is_better: true

# for multi-turn dialog responses
num_fewshot: 8

metadata:
  version: 1.0
