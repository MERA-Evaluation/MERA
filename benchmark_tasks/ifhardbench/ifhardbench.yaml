tag:
  - mera
  - mera_all
dataset_path: MERA-evaluation/IFHardBench
task: ifhardbench

test_split: test
fewshot_split: shots

output_type: generate_until

doc_to_text: "{{instruction.format(**inputs)}}"
doc_to_target: "{{outputs}}"

fewshot_config:
  sampler: !function ../custom_samplers.FewshotSampler
  doc_to_text_without_instruction: "{{'Требования к ответу:\n{constraints}\n\nЗадание:\n{question}'.format(**inputs)}}"
  query: "{{instruction.format(**inputs)}}"

target_delimiter: "\n\n"

generation_kwargs:
  do_sample: false
  temperature: 0.0
  max_gen_toks: 16384
  until:
    - "<|eot_id|>"
    - "<|im_end|>"
    - "</s>"

filter_list:
  - name: "scoring"
    filter:
      - function: remove_whitespace_and_nones
      - function: "take_first"

process_results: !function utils.process_results

metric_list:
  - metric: sample_pass_rate
    aggregation: mean
    higher_is_better: true
  - metric: constraint_pass_rate
    aggregation: !function utils.agg_constraint_pass_rate
    higher_is_better: true
  - metric: balance_score
    aggregation: !function utils.agg_balance_score
    higher_is_better: true

num_fewshot: null
metadata:
  version: 1.0
